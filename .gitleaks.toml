# gitleaks configuration. Extends the default rule set with the credential
# shapes this project's providers use. Run via `make scan` or the pre-commit
# hook; CI runs the same config over the full history.
title = "todocloud"

[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token"
regex = '''(?i)\b[A-Za-z0-9_-]{40}\b'''
path = '''(?i)(\.md|\.toml|\.ya?ml|\.go|\.sh|\.json)$'''
entropy = 3.5
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''TOKEN_GOES_HERE''',
  '''0{8,}''',
  '''(?i)example''',
  '''(?i)placeholder''',
  '''(?i)redacted''',
]

# This project writes test names as sentences, so a Go identifier here is
# routinely exactly forty characters and trips the rule above:
# `TestConcurrentAddsNeverLoseATaskSilently` has the same shape as a
# Cloudflare API token, and appears again in the doc comment above it.
#
# The exemption keys on the matched text, not on the line it sits in. An
# earlier attempt exempted function declarations and prose comments, which
# also exempted a token pasted bare into a comment — the case this rule most
# needs to catch, and the one CLAUDE.md §1.1 forbids in so many words. Go
# test identifiers begin with Test, Fuzz, Benchmark or Example; a credential
# that happens to be exactly forty characters AND to begin with one of those
# words is not a thing to design around.
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''^(Test|Fuzz|Benchmark|Example)[A-Za-z0-9_]*$''',
]

[[rules]]
id = "turso-db-token"
description = "Turso / libSQL database token (JWT)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''

[[rules]]
id = "gcp-service-account-key"
description = "GCP service account private key material"
regex = '''(?i)"private_key"\s*:\s*"-----BEGIN'''

[allowlist]
description = "Fixtures and placeholders that are intentionally fake"
paths = [
  '''(?i)/testdata/''',
  '''\.gitleaks\.toml$''',
  '''scripts/scan-secrets\.sh$''',
]
regexes = [
  '''libsql://example\.turso\.io''',
  '''TOKEN_GOES_HERE''',
  '''00000000-0000-0000-0000-000000000000''',
]
